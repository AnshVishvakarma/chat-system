[build]
  [build.python]
    version = "3.11"
    packages = ["gunicorn", "eventlet"]
  
  [build.node]
    version = "20"
  
  [build.commands]
    install = ["pip install -r backend/requirements.txt", "cd frontend && npm install"]
    build = ["cd frontend && npm run build"]

[start]
  command = "cd backend && gunicorn --worker-class eventlet -w 1 app:app"

[services]
  [services.frontend]
    port = 3000
    build = ["cd frontend && npm install && npm run build"]
    start = "cd frontend && npm start"
  
  [services.backend]
    port = 5000
    start = "cd backend && gunicorn --worker-class eventlet -w 1 app:app"
