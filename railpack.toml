[build]
  [build.python]
    version = "3.11"
  
  [build.node]
    version = "20"
  
  [build.commands]
    install = [
      "pip install -r backend/requirements.txt",
      "cd frontend && npm install"
    ]
    build = ["cd frontend && npm run build"]

[start]
  command = "cd backend && gunicorn --worker-class eventlet -w 1 app:app & cd frontend && npm start"
