services:
  - type: web
    name: chat-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --port=5000 app:app
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: chat-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://chat-backend.onrender.com
